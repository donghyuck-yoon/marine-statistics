name: Merge official KMA portal daily CSV
on:
  push:
    paths:
      - 'uploads/**'
      - 'scripts/import_portal_daily.py'
      - 'scripts/test_import_portal_daily.py'
      - '.github/workflows/import-portal-daily.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: official-portal-daily-csv-import
  cancel-in-progress: false
jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout existing official data
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run importer unit tests
        run: python -m unittest discover -s scripts -p 'test_import_portal_daily.py' -v
      - name: Validate, merge, and consume portal CSVs
        run: python scripts/import_portal_daily.py --apply
      - name: Commit only validated official data
        run: |
          git add -A data/ uploads/
          if git diff --cached --quiet; then
            echo "No incoming CSV / no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update official KMA daily data from portal CSV"
          git push origin HEAD:main
