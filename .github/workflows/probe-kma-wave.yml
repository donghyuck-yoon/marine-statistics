name: Probe historical wave buoy hourly observations (read-only)
on:
  push:
    paths:
      - .github/workflows/probe-kma-wave.yml
      - scripts/probe_kma_wave.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe coastal buoy station at four past timestamps
        env:
          KMA_API_KEY: ${{ secrets.KMA_API_KEY }}
        run: python scripts/probe_kma_wave.py
      - name: Upload sanitized station verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kma-wave-observation-probe
          path: wave-observation-probe.json
          if-no-files-found: ignore
